<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault Finds</title>
    <meta name="description" content="Vault Finds dashboard" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.useState = React.useState;
      window.useEffect = React.useEffect;
      window.useRef = React.useRef;

      fetch('./VaultFinds.jsx')
        .then((r) => r.text())
        .then((source) => {
          const sanitized = source
            .replace(/import\s*\{[^}]+\}\s*from\s*"react";?/, 'const { useState, useEffect, useRef } = React;')
            .replace('export default function VaultFinds()', 'function VaultFinds()')
            .concat('\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(VaultFinds));');

          const compiled = Babel.transform(sanitized, { presets: ['react'] }).code;
          new Function(compiled)();
        })
        .catch((error) => {
          document.body.innerHTML = '<pre style="color:#fff;padding:16px">Failed to load app: ' + String(error) + '</pre>';
        });
    </script>
  </body>
</html>
